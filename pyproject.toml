[project]
name = "hat-juggler"
version = "0.7.6"
description = "Hat Juggler protocol"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "aiohttp ~=3.13.3",
    "hat-aio ~=0.7.13",
    "hat-json ~=0.6.8",
    "hat-util ~=0.6.22",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "http://hat-open.com"
Repository = "https://github.com/hat-open/hat-juggler.git"
Documentation = "http://hat-juggler.hat-open.com"

[dependency-groups]
run = [
    "aiohttp ~=3.13.3",
    "hat-aio ~=0.7.13",
    "hat-json ~=0.6.8",
    "hat-util ~=0.6.22",
]
build = ["hat-doit ~=0.16.4"]
dev = [
    {include-group = "run"},
    {include-group = "build"},
]

[build-system]
requires = ["hat-doit ~=0.16.4"]
build-backend = "hat.doit.pep517"

[tool.hat-doit]
build_wheel_task = "build_py"

[tool.pytest.ini_options]
testpaths = ["test_pytest"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 300

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
include = ["src_py/*"]
data_file = "build/.coverage"
